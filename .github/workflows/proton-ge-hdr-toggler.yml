name: Update and publish proton-ge-hdr-toggler

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'steam/**'
      - 'data/**'
      - 'flatpak/**'
      - 'tests/**'
      - 'LICENSE'
      - '.github/workflows/proton-ge-hdr-toggler.yml'

concurrency:
  group: proton-ge-hdr-toggler-release
  cancel-in-progress: false

env:
  MANIFEST: flatpak/com.valvesoftware.Steam.CompatibilityTool.proton-ge-hdr-toggler.yml

jobs:
  publish:
    runs-on: ${{ vars.FLATPAK_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh release and HDR catalog
        run: /usr/bin/python3 scripts/update.py
      - name: Check for changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != schedule ] || ! git diff --quiet -- flatpak data; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.changes.outputs.build == 'true'
        run: |
          if ! command -v flatpak-builder >/dev/null || ! /usr/bin/python3 -c 'import gi' 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y flatpak flatpak-builder python3-gi gir1.2-glib-2.0 gnupg
          fi
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Enable Flatpak build sandboxes on hosted Ubuntu
        if: steps.changes.outputs.build == 'true' && runner.environment == 'github-hosted'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test
        if: steps.changes.outputs.build == 'true'
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Cache upstream downloads
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: .flatpak-builder/downloads
          key: ${{ runner.os }}-proton-ge-hdr-toggler-${{ hashFiles('flatpak/*.yml') }}
      - name: Configure Pages
        if: steps.changes.outputs.build == 'true'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and sign the Flatpak repository
        if: steps.changes.outputs.build == 'true'
        env:
          SIGNING_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          SIGNING_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          REPO_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          test -n "$SIGNING_KEY" && test -n "$SIGNING_ID" || { echo 'Configure the signing secrets described in docs/PUBLISHING.md'; exit 1; }
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          flatpak-builder --user --assumeyes --install-deps-from=flathub --force-clean --disable-rofiles-fuse --gpg-sign="$SIGNING_ID" --repo=dist/repo dist/build "$MANIFEST"
          /usr/bin/python3 scripts/publish.py --repository dist/repo --gpg-key "$SIGNING_ID" --url "$REPO_URL"
      - name: Upload repository
        if: steps.changes.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/repo
          retention-days: 1
      - name: Deploy repository
        if: steps.changes.outputs.build == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Commit published build inputs
        if: steps.changes.outputs.build == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST" data/hdr-games.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update bundled Proton-GE and HDR catalog'
            git push
          fi
